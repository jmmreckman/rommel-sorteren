<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Resultaten — Rommel Sorteren</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="/">&larr; hoofdpagina</a>
  </div>
  <h1>✅ Resultaten</h1>
  <p class="muted" style="margin-top:-8px;">Tik op een foto om de categorie alsnog aan te passen.</p>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="leeg" style="display:none;">Nog geen definitieve foto's in deze categorie.</div>
</div>
<div class="toast" id="toast"></div>
<script src="/assets/app.js"></script>
<script>
let categories = [];
let groepen = [];
let actief = 0;

function toonGroep(i) {
  actief = i;
  document.querySelectorAll('#tabs button').forEach((b, idx) => {
    const actief = idx === i;
    b.classList.toggle('active', actief);
    b.style.background = actief ? groepen[idx].category.color : 'white';
    b.style.borderColor = groepen[idx].category.color;
    b.style.color = actief ? 'white' : 'var(--text)';
  });
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const photos = groepen[i].photos;
  document.getElementById('leeg').style.display = photos.length ? 'none' : 'block';
  photos.forEach(p => {
    const fig = document.createElement('figure');

    const img = document.createElement('img');
    img.src = '/' + p.thumb_small;
    img.alt = p.filename;
    img.style.cursor = 'pointer';
    img.addEventListener('click', () => openCategoriePicker(p));
    fig.appendChild(img);

    const del = document.createElement('button');
    del.className = 'delete-overlay';
    del.textContent = '×';
    del.title = 'Foto verwijderen';
    del.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!(await verwijderFoto(p.id))) return;
      await herlaad();
    });
    fig.appendChild(del);
    fig.appendChild(maakTagInput(p.id, p.tags));

    if (p.person_name) {
      const cap = document.createElement('figcaption');
      cap.textContent = p.person_name;
      fig.appendChild(cap);
    }
    grid.appendChild(fig);
  });
}

function openCategoriePicker(photo) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const kaart = document.createElement('div');
  kaart.className = 'modal-kaart';
  kaart.innerHTML = `<h2 style="margin-top:0;">Verplaatsen naar:</h2>`;

  const lijst = document.createElement('div');
  categories.forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn secondary';
    b.style.textAlign = 'left';
    b.innerHTML = `<span class="dot" style="background:${c.color}"></span> ${c.name}`;
    b.addEventListener('click', async () => {
      let naam = null;
      if (c.requires_name) {
        naam = prompt('Naam van wie het krijgt:');
        if (!naam) return;
      } else if (c.requires_note) {
        naam = prompt('Toelichting:');
        if (!naam) return;
      }
      try {
        const result = await api('/api/choice', {
          method: 'POST',
          body: JSON.stringify({ photo_id: photo.id, category_id: c.id, person_name: naam }),
        });
        if (result.definitief && result.override) {
          showToast(`Verplaatst naar ${c.name} — direct definitief`);
        } else if (result.partner_chose && !result.match) {
          showToast('Verplaatst — maar staat nu in het overleg, jullie zijn het niet meer eens');
        } else {
          showToast('Verplaatst naar ' + c.name);
        }
        overlay.remove();
        await herlaad();
      } catch (e) {
        alert('Verplaatsen mislukt: ' + e.message);
      }
    });
    lijst.appendChild(b);
  });
  kaart.appendChild(lijst);

  const sluit = document.createElement('div');
  sluit.className = 'modal-sluiten';
  sluit.textContent = 'Annuleren';
  sluit.addEventListener('click', () => overlay.remove());
  kaart.appendChild(sluit);

  overlay.appendChild(kaart);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

async function herlaad() {
  groepen = await api('/api/resultaten');
  document.querySelectorAll('#tabs button').forEach((b, idx) => {
    b.textContent = `${groepen[idx].category.name} (${groepen[idx].photos.length})`;
  });
  toonGroep(actief);
}

(async function init() {
  categories = await api('/api/categories');
  groepen = await api('/api/resultaten');
  const tabs = document.getElementById('tabs');
  groepen.forEach((g, i) => {
    const b = document.createElement('button');
    b.textContent = `${g.category.name} (${g.photos.length})`;
    b.style.borderColor = g.category.color;
    b.addEventListener('click', () => toonGroep(i));
    tabs.appendChild(b);
  });
  if (groepen.length) toonGroep(0);
})();
</script>
</body>
</html>
