<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Foto toevoegen — Rommel Sorteren</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="/">&larr; hoofdpagina</a>
    <span class="muted" id="teller">0 foto's deze sessie</span>
  </div>
  <h1>📸 Foto toevoegen</h1>
  <p class="muted">Maak een foto, geef 'm een naam/tags (bv. "beker, keuken") en upload. Zoek daarmee later terug via "Zoeken" — dan hoef je niks op het voorwerp te plakken.</p>

  <div id="startkaart">
    <label class="btn" for="fotoinput" style="display:block; text-align:center;">📷 Foto maken</label>
    <input type="file" id="fotoinput" accept="image/*" capture="environment" style="display:none;">
  </div>

  <div class="card" id="invoerkaart" style="display:none;">
    <img id="preview" src="" alt="" style="width:100%;border-radius:12px;margin-bottom:12px;">
    <input type="text" id="tagsinput" placeholder="naam/tags, met komma's gescheiden (optioneel)"
      style="width:100%;padding:14px;font-size:1rem;border-radius:10px;border:1px solid var(--border);margin-bottom:10px;">
    <button class="btn" id="uploadbtn">Uploaden</button>
    <button class="btn secondary" id="annuleerbtn">Opnieuw maken</button>
  </div>

  <div class="card" id="wachtkaart" style="display:none; text-align:center;">
    <p class="muted">Bezig met uploaden...</p>
  </div>

  <div class="card" id="okkaart" style="display:none; text-align:center;">
    <p style="font-size:1.4rem;">✅ Opgeslagen</p>
    <p class="muted" id="oktags"></p>
  </div>

  <div class="card" id="foutkaart" style="display:none; text-align:center; color:var(--cat4);"></div>
</div>
<div class="toast" id="toast"></div>
<script src="/assets/app.js"></script>
<script>
let count = 0;
let gekozenBestand = null;
const input = document.getElementById('fotoinput');

function toonKaart(id) {
  ['startkaart', 'invoerkaart', 'wachtkaart', 'okkaart', 'foutkaart'].forEach(k => {
    document.getElementById(k).style.display = (k === id) ? 'block' : 'none';
  });
}

input.addEventListener('change', () => {
  const file = input.files[0];
  if (!file) return;
  gekozenBestand = file;
  document.getElementById('preview').src = URL.createObjectURL(file);
  document.getElementById('tagsinput').value = '';
  toonKaart('invoerkaart');
  document.getElementById('tagsinput').focus();
});

document.getElementById('annuleerbtn').addEventListener('click', () => {
  gekozenBestand = null;
  input.value = '';
  toonKaart('startkaart');
});

document.getElementById('uploadbtn').addEventListener('click', async () => {
  if (!gekozenBestand) return;
  const tags = document.getElementById('tagsinput').value.trim();
  toonKaart('wachtkaart');

  try {
    const formData = new FormData();
    formData.append('file', gekozenBestand);
    formData.append('tags', tags);
    const res = await fetch('/api/photos/upload', { method: 'POST', body: formData });
    if (res.status === 401) { location.href = '/login'; return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || res.statusText);
    }
    const data = await res.json();
    count++;
    document.getElementById('teller').textContent = `${count} foto's deze sessie`;
    document.getElementById('oktags').textContent = tags ? `Tags: ${tags}` : '(geen tags ingevuld)';
    toonKaart('okkaart');
    setTimeout(() => {
      gekozenBestand = null;
      input.value = '';
      toonKaart('startkaart');
    }, 1400);
  } catch (e) {
    document.getElementById('foutkaart').textContent = 'Uploaden mislukt: ' + e.message;
    toonKaart('foutkaart');
  }
});
</script>
</body>
</html>
