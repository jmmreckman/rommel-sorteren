services:
  rommel:
    build: .
    container_name: rommel-sorteren
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8123:8000"
    networks:
      - default
      - deploy_default

networks:
  default:
  deploy_default:
    external: true
